<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PROTOTYPE — TUI-Style Docked Activity (?variant=A|B|C)</title>
<style>
  /*
    Three TUI-inspired docked Activity styles modeled directly on pa-tui
    (bash_view, heartbeats_picker, chrome::ActivityDock):
      - Flat hairline rules, zero heavy card borders or status pill boxes
      - Columned tables with dim headers, › selection marker, and ●/◐/○ status dots
      - In-place list -> detail drill-in with › Action + dim description rows
      - All-Dynamic Per-Session Right sidebar tabs
    Switch via ?variant=A|B|C or the floating bottom-center switcher (← / →).
  */
  :root {
    --bg: #111214;
    --panel: #151619;
    --surface: #1b1d21;
    --hover: rgba(255, 255, 255, 0.045);
    --select-wash: rgba(255, 255, 255, 0.075);
    --rule: #252830;
    --rule-strong: #323640;
    --ink: #e8ebf0;
    --muted: #939ba8;
    --dim: #636b78;
    --gold: #eab308;
    --green: #34d399;
    --red: #f87171;
    --blue: #60a5fa;
    --font-sans: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* Title bar */
  .titlebar {
    height: 38px; background: var(--bg); border-bottom: 1px solid var(--rule);
    display: flex; align-items: center; padding: 0 12px; gap: 10px; flex-shrink: 0;
  }
  .tb-crumb { display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 12.5px; }
  .tb-crumb .sep { color: var(--dim); }
  .tb-spacer { flex: 1; }
  .tb-btn {
    height: 26px; padding: 0 9px; border-radius: 6px; border: 1px solid transparent;
    background: transparent; color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer; font: inherit; font-size: 12px;
  }
  .tb-btn:hover { background: var(--hover); color: var(--ink); }
  .tb-btn.active { background: var(--select-wash); color: var(--ink); }

  .shell { flex: 1; display: flex; min-height: 0; }

  /* Left sidebar */
  .left-sidebar {
    width: 220px; background: var(--panel); border-right: 1px solid var(--rule);
    padding: 10px 8px; display: flex; flex-direction: column; gap: 5px; flex-shrink: 0;
  }
  .sb-hdr {
    font-size: 10.5px; font-weight: 600; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px 4px;
  }
  .sess-row {
    padding: 7px 9px; border-radius: 6px; cursor: pointer;
    display: flex; flex-direction: column; gap: 2px;
  }
  .sess-row:hover { background: var(--hover); }
  .sess-row.active { background: var(--select-wash); }
  .sess-top { display: flex; align-items: center; gap: 7px; }
  .sdot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .sdot.running { background: var(--gold); }
  .sdot.idle { background: var(--green); }
  .sess-title { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-meta { font-size: 11px; color: var(--dim); padding-left: 13px; font-variant-numeric: tabular-nums; }

  /* Center column */
  .center {
    flex: 1; min-width: 360px; display: flex; flex-direction: column;
    background: var(--bg); min-height: 0;
  }
  .transcript {
    flex: 1; overflow-y: auto; padding: 20px 26px; display: flex; flex-direction: column;
  }
  .transcript-inner {
    width: 100%; max-width: 740px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 640px; line-height: 1.5; }
  .msg.user {
    align-self: flex-end; background: var(--surface); border: 1px solid var(--rule);
    padding: 9px 13px; border-radius: 10px;
  }
  .msg.assistant { align-self: flex-start; color: #dfe3ea; }
  .tool-line {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--dim); margin-top: 5px;
  }

  /* Composer */
  .composer-outer {
    padding: 0 24px 58px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
  }
  .composer-col { width: 100%; max-width: 740px; display: flex; flex-direction: column; }
  .composer-card {
    background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 11px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .composer-body { padding: 10px 12px 9px; display: flex; flex-direction: column; gap: 10px; }
  .composer-placeholder { color: var(--dim); font-size: 13px; }
  .composer-bar { display: flex; align-items: center; gap: 8px; }
  .plus-btn {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--rule);
    background: var(--surface); color: var(--muted); display: inline-flex; align-items: center;
    justify-content: center; cursor: pointer; font-size: 15px;
  }
  .activity-chip {
    height: 26px; display: inline-flex; align-items: center; background: var(--surface);
    border: 1px solid var(--rule-strong); border-radius: 7px; padding: 2px; gap: 2px;
  }
  .chip-seg {
    height: 20px; padding: 0 8px; border-radius: 5px; border: none; background: transparent;
    color: var(--dim); display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    font: inherit; font-size: 11.5px; font-variant-numeric: tabular-nums;
  }
  .chip-seg:hover { background: var(--hover); color: var(--ink); }
  .chip-seg.running { color: var(--gold); }
  .chip-seg.open { background: var(--select-wash); color: var(--ink); }
  .chip-seg.open.running { color: var(--gold); }
  .send-btn {
    margin-left: auto; height: 26px; padding: 0 11px; border-radius: 7px; border: none;
    background: var(--ink); color: #111; font-weight: 600; font-size: 12px; cursor: pointer;
  }

  /* =========================================================
     TUI DOCK SHARED PRIMITIVES (pa-tui aesthetic)
     ========================================================= */
  .tui-pane-full {
    width: 100%;
    background: var(--bg);
    border-top: 1px solid var(--rule-strong);
    padding: 8px 18px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 270px;
    flex-shrink: 0;
  }
  .tui-pane-attached {
    background: #121316;
    border-bottom: 1px solid var(--rule);
    padding: 9px 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 265px;
  }
  .tui-pane-ledger {
    width: 100%;
    background: var(--bg);
    border-top: 1px solid var(--rule-strong);
    padding: 7px 18px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 255px;
    flex-shrink: 0;
  }

  .tui-top {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 22px;
  }
  .tui-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .tui-nav-tabs {
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .tui-nav-btn {
    border: none;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    padding: 2px 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-variant-numeric: tabular-nums;
  }
  .tui-nav-btn:hover { color: var(--muted); }
  .tui-nav-btn.active { color: var(--ink); font-weight: 600; }
  .tui-nav-btn .cnt-live { color: var(--gold); }
  .tui-close {
    margin-left: auto;
    border: none;
    background: transparent;
    color: var(--dim);
    font-family: var(--font-mono);
    font-size: 11px;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .tui-close:hover { color: var(--ink); background: var(--hover); }

  /* Borderless TUI column table */
  .tui-scroll {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-height: 0;
    flex: 1;
  }
  .tui-thead, .tui-trow {
    display: grid;
    align-items: center;
    gap: 14px;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .tui-thead {
    color: var(--dim);
    font-size: 11px;
    padding-bottom: 4px;
  }
  .tui-trow {
    cursor: pointer;
    color: var(--ink);
    min-height: 25px;
  }
  .tui-trow:hover { background: var(--hover); }
  .tui-trow.selected { background: var(--select-wash); font-weight: 600; }
  .tui-trow .caret {
    display: inline-block;
    width: 11px;
    color: var(--gold);
    font-family: var(--font-mono);
    font-weight: 700;
  }
  .tui-trow:not(.selected) .caret { visibility: hidden; }
  .tui-cols-sub { grid-template-columns: 165px 1fr 56px 96px; }
  .tui-cols-hb  { grid-template-columns: 92px 1fr 70px 84px; }
  .tui-cols-sh  { grid-template-columns: 1fr 64px 58px 88px; }

  .st-run { color: var(--green); }
  .st-gold { color: var(--gold); }
  .st-pause { color: var(--gold); }
  .st-err { color: var(--red); }
  .st-dim { color: var(--dim); }
  .c-muted { color: var(--muted); font-weight: 400; }
  .c-dim { color: var(--dim); font-weight: 400; }
  .mono { font-family: var(--font-mono); font-size: 11.5px; }
  .trunc { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* TUI Drill-in detail view */
  .tui-back {
    border: none; background: transparent; color: var(--muted);
    font: inherit; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    padding: 1px 4px; border-radius: 4px;
  }
  .tui-back:hover { color: var(--ink); background: var(--hover); }
  .tui-meta-line {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
    padding: 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tui-meta-line .lbl { color: var(--dim); }
  .tui-pairs {
    display: grid;
    grid-template-columns: 78px 1fr;
    gap: 2px 12px;
    padding: 2px 8px;
    font-size: 12px;
  }
  .tui-pairs .k { color: var(--dim); font-family: var(--font-mono); font-size: 11.5px; }
  .tui-pairs .v { color: var(--muted); }
  .tui-tail {
    margin: 2px 8px;
    padding: 6px 10px;
    border-left: 2px solid var(--rule-strong);
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.48;
    color: #cfd6e3;
    white-space: pre-wrap;
    max-height: 98px;
    overflow-y: auto;
  }
  .tui-actions {
    display: flex;
    flex-direction: column;
    gap: 1px;
    margin-top: 2px;
  }
  .tui-action {
    border: none;
    background: transparent;
    text-align: left;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .tui-action:hover { background: var(--select-wash); }
  .tui-action .a-caret { color: var(--gold); font-family: var(--font-mono); width: 10px; }
  .tui-action .a-lbl { font-weight: 500; }
  .tui-action.danger:hover .a-lbl { color: var(--red); }
  .tui-action .a-desc { color: var(--dim); font-size: 11.5px; }

  .tui-hint {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--dim);
    padding: 3px 8px 0;
    border-top: 1px solid rgba(255,255,255,0.04);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .tui-hint-btn {
    border: none; background: transparent; color: var(--muted);
    font-family: var(--font-mono); font-size: 11px; cursor: pointer;
  }
  .tui-hint-btn:hover { color: var(--ink); text-decoration: underline; }

  /* Inline TUI form for + Set heartbeat */
  .tui-hb-form {
    padding: 6px 8px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    border-top: 1px solid var(--rule);
  }
  .tui-input {
    background: var(--panel);
    border: 1px solid var(--rule-strong);
    color: var(--ink);
    border-radius: 4px;
    padding: 4px 7px;
    font: inherit;
    font-size: 12px;
    outline: none;
  }
  .tui-input:focus { border-color: var(--gold); }

  /* Variant C: Stacked TUI Ledger rows */
  .tui-sec-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  .tui-sec-row:hover { background: var(--hover); }
  .tui-sec-row.active { background: var(--select-wash); }
  .tui-sec-k { width: 106px; color: var(--muted); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .tui-sec-k.live { color: var(--gold); }
  .tui-sec-items { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; padding: 2px 0 4px 20px; }
  .tui-inline-act {
    border: none; background: transparent; color: var(--dim); font-family: var(--font-mono);
    font-size: 11px; cursor: pointer; padding: 1px 5px; border-radius: 3px;
  }
  .tui-inline-act:hover { color: var(--ink); background: var(--select-wash); }
  .tui-inline-act.danger:hover { color: var(--red); }

  /* Right sidebar (All Dynamic · Per-Session) */
  .right-sidebar {
    width: 455px; min-width: 290px; background: var(--panel); border-left: 1px solid var(--rule);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .right-sidebar.collapsed { display: none; }
  .rs-tabbar {
    height: 36px; background: #121316; border-bottom: 1px solid var(--rule);
    display: flex; align-items: center; padding: 0 6px; gap: 3px; overflow-x: auto; flex-shrink: 0;
  }
  .rs-tab {
    height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid transparent;
    background: transparent; color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer; font-size: 12px; white-space: nowrap; flex-shrink: 0;
  }
  .rs-tab:hover { background: var(--hover); color: var(--ink); }
  .rs-tab.active { background: var(--select-wash); color: var(--ink); font-weight: 500; }
  .rs-x {
    width: 15px; height: 15px; border-radius: 3px; border: none; background: transparent;
    color: var(--dim); font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .rs-x:hover { background: rgba(255,255,255,0.1); color: var(--ink); }
  .rs-add-diff {
    margin-left: auto; font-size: 11px; color: var(--dim); border: 1px dashed var(--rule-strong);
    background: transparent; border-radius: 5px; padding: 2px 7px; cursor: pointer; flex-shrink: 0;
  }
  .rs-add-diff:hover { color: var(--ink); border-color: var(--muted); }
  .rs-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 9px; min-height: 0; }
  .rs-hdr { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
  .diff-card { border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; background: #121316; }
  .diff-hdr {
    padding: 6px 10px; background: var(--surface); border-bottom: 1px solid var(--rule);
    font-family: var(--font-mono); font-size: 11.5px; display: flex; justify-content: space-between;
  }
  .diff-code { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.5; padding: 6px 0; }
  .dl { padding: 0 10px; white-space: pre; }
  .dl.add { background: rgba(52,211,153,0.10); color: #a7f3d0; }
  .dl.del { background: rgba(248,113,113,0.10); color: #fecaca; }
  .dl.ctx { color: var(--muted); }
  .sub-msg { padding: 7px 10px; border-left: 2px solid var(--rule-strong); font-size: 12px; line-height: 1.48; }
  .sub-msg .role { font-family: var(--font-mono); font-size: 10.5px; color: var(--dim); margin-bottom: 2px; }
  .term-full {
    background: #0c0d0f; border: 1px solid var(--rule); border-radius: 6px;
    padding: 9px 11px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.5;
    color: #d6dce6; white-space: pre-wrap; flex: 1; overflow-y: auto;
  }
  .readonly-note {
    margin-top: auto; padding: 6px 8px; border-top: 1px solid var(--rule);
    color: var(--dim); font-family: var(--font-mono); font-size: 11px;
  }
  .empty-line { padding: 10px 8px; color: var(--dim); font-size: 12px; }

  /* Floating bottom-center Prototype Switcher */
  .proto-switcher {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: #1f1b12; border: 1px solid rgba(234, 179, 8, 0.5); border-radius: 999px;
    padding: 4px 6px; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65); z-index: 60; font-size: 12px;
  }
  .sw-arrow {
    width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(234, 179, 8, 0.35);
    background: rgba(234, 179, 8, 0.12); color: var(--gold); cursor: pointer; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sw-arrow:hover { background: rgba(234, 179, 8, 0.25); }
  .sw-label { color: #fef3c7; font-weight: 600; padding: 0 4px; white-space: nowrap; }
  .sw-hint { color: #a89974; font-size: 11px; padding-right: 6px; }
</style>
</head>
<body>

<div class="titlebar">
  <div class="tb-crumb">
    <span>prime-agent-app</span><span class="sep">/</span><span style="color:var(--muted)">main</span>
  </div>
  <div class="tb-spacer"></div>
  <button class="tb-btn active" id="rs-toggle-btn">
    <span>Right sidebar</span>
    <span class="c-dim mono" id="rs-tab-count">1</span>
  </button>
</div>

<div class="shell">
  <aside class="left-sidebar">
    <div class="sb-hdr">Left sidebar · Sessions</div>
    <div id="session-list"></div>
  </aside>

  <main class="center">
    <div class="transcript"><div class="transcript-inner" id="transcript"></div></div>

    <!-- Style A & Style C mount directly above composer (full center width, flat hairline rule) -->
    <div id="full-dock-slot"></div>

    <div class="composer-outer">
      <div class="composer-col">
        <div class="composer-card">
          <!-- Style B mounts seamlessly inside top of composer column -->
          <div id="attached-dock-slot"></div>

          <div class="composer-body">
            <div class="composer-placeholder">Message Prime Agent… (click any chip segment below, or press ↑/↓/Enter/Esc)</div>
            <div class="composer-bar">
              <button class="plus-btn" title="Attach">+</button>
              <div class="activity-chip" id="activity-chip"></div>
              <button class="send-btn">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <aside class="right-sidebar" id="right-sidebar">
    <div class="rs-tabbar" id="rs-tabbar"></div>
    <div class="rs-body" id="rs-body"></div>
  </aside>
</div>

<div class="proto-switcher">
  <button class="sw-arrow" id="sw-prev" title="Previous style (←)">←</button>
  <span class="sw-label" id="sw-label"></span>
  <span class="sw-hint" id="sw-hint"></span>
  <button class="sw-arrow" id="sw-next" title="Next style (→)">→</button>
</div>

<script>
const VARIANTS = [
  { key: "A", name: "TUI Pane + Drill-In", hint: "Full-width hairline dock · pa-tui column table -> in-place detail" },
  { key: "B", name: "TUI Composer Sheet", hint: "Same borderless TUI table & drill-in · tucked inside composer width, chip = tabs" },
  { key: "C", name: "TUI Expanded Ledger", hint: "pa-tui ActivityDock stacked rows (◆ / ◷ / >_) · click jumps straight to Right sidebar" }
];

function urlVariant() {
  const v = (new URLSearchParams(location.search).get("variant") || "A").toUpperCase();
  return VARIANTS.some(x => x.key === v) ? v : "A";
}

const state = {
  variant: urlVariant(),
  activeSessionId: "s1",
  rightSidebarOpen: true,
  dockTab: "subagents",    // null | "subagents" | "heartbeats" | "shells"
  selectedIndex: 0,
  drillId: null,           // non-null when drilled into one row (Styles A & B)
  hbEditing: false,

  sessions: {
    s1: {
      id: "s1",
      name: "Activity chip & Right sidebar",
      status: "running",
      branch: "main",
      messages: [
        { role: "user", text: "Wire up the Activity chip UI matching the terminal UI feel." },
        { role: "assistant", text: "Spawning two subagents to inspect daemon heartbeat handlers and shell tail APIs, and running `cargo test -p pa-ui` in the background.", tools: ["rlm.spawn('audit-heartbeats')", "rlm.spawn('audit-shells')", "bash('cargo test -p pa-ui')"] }
      ],
      diffFiles: [
        { file: "crates/pa-ui/src/composer.rs", stats: "+18 -3", lines: [
          { t: "ctx", s: "  pub(crate) fn render_activity_chip(&self) {" },
          { t: "del", s: "-   let ink = if count > 0 { p.working } else { p.quiet_ink };" },
          { t: "add", s: "+   let (val, live) = chip_display(running, total);" },

function cur() { return state.sessions[state.activeSessionId]; }
function metric(running, total) { return running > 0 ? { num: running, live: true } : { num: total, live: false }; }
function stats(s) {
  return {
    sub: metric(s.subagents.filter(x => x.status === "running").length, s.subagents.length),
    hb: metric(s.heartbeats.filter(x => x.status === "active").length, s.heartbeats.length),
    sh: metric(s.shells.filter(x => x.status === "running").length, s.shells.length)
  };
}
function statusDotHtml(status, exitCode) {
  if (status === "running" || status === "active") return `<span class="st-run">● ${status}</span>`;
  if (status === "paused") return `<span class="st-pause">◐ paused</span>`;
  if (status === "cancelled" || (exitCode !== null && exitCode !== undefined && exitCode !== 0)) {
    return `<span class="st-err">● ${status === "cancelled" ? "cancelled" : "exit " + exitCode}</span>`;
  }
  return `<span class="st-dim">○ ${status}</span>`;
}

function openRightTab(tab) {
  const s = cur();
  if (!s.tabs.some(t => t.id === tab.id)) s.tabs.push(tab);
  s.activeTab = tab.id;
  state.rightSidebarOpen = true;
  render();
}
function closeRightTab(id) {
  const s = cur();
  const idx = s.tabs.findIndex(t => t.id === id);
  if (idx < 0) return;
  s.tabs.splice(idx, 1);
  if (s.activeTab === id) s.activeTab = s.tabs[Math.max(0, idx - 1)]?.id ?? null;
  if (!s.tabs.length) state.rightSidebarOpen = false;
  render();
}
function stopSub(s, sub) { sub.status = "cancelled"; sub.activity = "Cancelled by user"; render(); }
function delSub(s, sub) { s.subagents = s.subagents.filter(x => x.id !== sub.id); state.drillId = null; closeRightTab("sub:" + sub.id); render(); }
function killSh(s, sh) { sh.status = "finished"; sh.exit = 130; sh.tail += "\n[killed by reader]"; render(); }

function setVariant(key) {
  state.variant = key;
  const u = new URL(location.href);
  u.searchParams.set("variant", key);
  history.replaceState(null, "", u);
  if (!state.dockTab) state.dockTab = "subagents";
  state.drillId = null;
  state.hbEditing = false;
  state.selectedIndex = 0;
  render();
}
function cycleVariant(d) {
  const i = VARIANTS.findIndex(v => v.key === state.variant);
  setVariant(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key);
}

function buildHbForm(s) {
  const userHb = s.heartbeats.find(h => h.owner === "user");
  const f = document.createElement("div");
  f.className = "tui-hb-form";
  f.innerHTML = `
    <input class="tui-input mono" id="hb-s" style="width:94px" placeholder="every 5m" value="${userHb ? userHb.schedule : "every 5m"}" />
    <select class="tui-input" id="hb-d">
      <option value="steer" ${!userHb || userHb.delivery === "steer" ? "selected" : ""}>steer</option>
      <option value="follow-up" ${userHb && userHb.delivery === "follow-up" ? "selected" : ""}>follow-up</option>
    </select>
    <input class="tui-input" id="hb-p" style="flex:1;min-width:160px" placeholder="Instruction for each beat…" value="${userHb ? userHb.prompt : ""}" />
    <button class="tui-hint-btn" id="hb-save" style="color:var(--ink);font-weight:600">save</button>
    <button class="tui-hint-btn" id="hb-cancel">cancel</button>
  `;
  f.querySelector("#hb-cancel").onclick = () => { state.hbEditing = false; render(); };
  f.querySelector("#hb-save").onclick = () => {
    const sched = f.querySelector("#hb-s").value.trim() || "every 5m";
    const deliv = f.querySelector("#hb-d").value;
    const prompt = f.querySelector("#hb-p").value.trim() || "Check build status and summarize any blockers.";
    if (userHb) { userHb.schedule = sched; userHb.delivery = deliv; userHb.prompt = prompt; userHb.status = "active"; userHb.nextRun = "5m"; }
    else s.heartbeats.unshift({ id: "hb-" + Date.now(), owner: "user", schedule: sched, rawCron: "*/5 * * * *", delivery: deliv, status: "active", nextRun: "5m", runs: 0, prompt });
    state.hbEditing = false;
    render();
  };
  return f;
}

/* Shared TUI Table + Drill-in renderer used by Style A (full-width) and Style B (attached to composer) */
function buildTuiTableOrDetail(s, st, showTopTabs) {
  const frag = document.createDocumentFragment();

  // Header row
  const top = document.createElement("div");
  top.className = "tui-top";
  if (state.drillId) {
    const back = document.createElement("button");
    back.className = "tui-back";
    back.textContent = "← back";
    back.onclick = () => { state.drillId = null; state.hbEditing = false; render(); };
    top.appendChild(back);
    const nameSpan = document.createElement("span");
    nameSpan.className = "tui-title trunc";
    if (state.dockTab === "subagents") {
      const sub = s.subagents.find(x => x.id === state.drillId);
      nameSpan.textContent = sub ? sub.name : "Subagent";
    } else if (state.dockTab === "heartbeats") {
      const hb = s.heartbeats.find(x => x.id === state.drillId);
      nameSpan.textContent = hb ? `${hb.schedule} · ${hb.delivery}` : "Heartbeat";
    } else {
      const sh = s.shells.find(x => x.id === state.drillId);
      nameSpan.className += " mono";
      nameSpan.textContent = sh ? sh.cmd : "Shell";
    }
    top.appendChild(nameSpan);
  } else if (showTopTabs) {
    const nav = document.createElement("div");
    nav.className = "tui-nav-tabs";
    [
      { id: "subagents", lbl: "Subagents", m: st.sub },
      { id: "heartbeats", lbl: "Heartbeats", m: st.hb },
      { id: "shells", lbl: "Shells", m: st.sh }
    ].forEach(t => {
      const b = document.createElement("button");
      b.className = "tui-nav-btn" + (state.dockTab === t.id ? " active" : "");
      b.innerHTML = `${t.lbl} <span class="${t.m.live ? "cnt-live" : "c-dim"}">${t.m.num}</span>`;
      b.onclick = () => { state.dockTab = t.id; state.selectedIndex = 0; state.drillId = null; state.hbEditing = false; render(); };
      nav.appendChild(b);
    });
    top.appendChild(nav);
  } else {
    const titles = { subagents: "Subagents", heartbeats: "Heartbeats", shells: "Shells" };
    const m = state.dockTab === "subagents" ? st.sub : (state.dockTab === "heartbeats" ? st.hb : st.sh);
    top.innerHTML = `<span class="tui-title">${titles[state.dockTab]} <span class="${m.live ? "st-gold" : "c-dim"} mono">${m.num}</span></span>`;
  }
  const close = document.createElement("button");
  close.className = "tui-close"; close.textContent = "esc"; close.title = "Close";
  close.onclick = () => { state.dockTab = null; state.drillId = null; state.hbEditing = false; render(); };
  top.appendChild(close);
  frag.appendChild(top);

  const scroll = document.createElement("div");
  scroll.className = "tui-scroll";

  /* ---------- DRILL-IN DETAIL ---------- */
  if (state.drillId) {
    if (state.dockTab === "subagents") {
      const sub = s.subagents.find(x => x.id === state.drillId);
      if (sub) {
        const meta = document.createElement("div");
        meta.className = "tui-meta-line";
        meta.innerHTML = `<span class="lbl">model</span> ${sub.model} <span class="lbl">· duration</span> ${sub.duration} <span class="lbl">·</span> ${statusDotHtml(sub.status)}`;
        scroll.appendChild(meta);

        const tail = document.createElement("div");
        tail.className = "tui-tail";
        tail.textContent = sub.transcript.map(m => `[${m.role}] ${m.text}`).join("\n");
        scroll.appendChild(tail);

        const acts = document.createElement("div");
        acts.className = "tui-actions";
        acts.innerHTML = `
          <button class="tui-action" id="d-open"><span class="a-caret">›</span><span class="a-lbl">Open in Right sidebar</span><span class="a-desc">Watch read-only transcript alongside this session</span></button>
          ${sub.status === "running"
            ? `<button class="tui-action danger" id="d-stop"><span class="a-caret">›</span><span class="a-lbl">Stop</span><span class="a-desc">Abort subagent and record "Cancelled by user"</span></button>`
            : `<button class="tui-action danger" id="d-del"><span class="a-caret">›</span><span class="a-lbl">Delete</span><span class="a-desc">Remove inactive subagent from this session</span></button>`}
        `;
        acts.querySelector("#d-open").onclick = () => openRightTab({ id: "sub:" + sub.id, kind: "subagent", refId: sub.id, title: sub.name });
        const sb = acts.querySelector("#d-stop"); if (sb) sb.onclick = () => stopSub(s, sub);
        const db = acts.querySelector("#d-del"); if (db) db.onclick = () => delSub(s, sub);
        scroll.appendChild(acts);
      }
    } else if (state.dockTab === "heartbeats") {
      const hb = s.heartbeats.find(x => x.id === state.drillId);
      if (hb) {
        const pairs = document.createElement("div");
        pairs.className = "tui-pairs";
        pairs.innerHTML = `
          <div class="k">created</div><div class="v">${hb.owner}</div>
          <div class="k">delivery</div><div class="v">${hb.delivery}</div>
          <div class="k">schedule</div><div class="v">${hb.schedule} (${hb.rawCron})</div>
          <div class="k">next run</div><div class="v">${hb.nextRun} · ${hb.runs} runs</div>
          <div class="k">prompt</div><div class="v" style="color:var(--ink)">${hb.prompt}</div>
        `;
        scroll.appendChild(pairs);
        const acts = document.createElement("div");
        acts.className = "tui-actions";
        acts.innerHTML = `
          <button class="tui-action" id="h-tog"><span class="a-caret">›</span><span class="a-lbl">${hb.status === "active" ? "Pause" : "Resume"}</span><span class="a-desc">${hb.status === "active" ? "Pause scheduled firing without deleting" : "Resume scheduled firing"}</span></button>
          <button class="tui-action" id="h-ed"><span class="a-caret">›</span><span class="a-lbl">Edit</span><span class="a-desc">Update schedule, delivery mode, or instruction</span></button>
          <button class="tui-action danger" id="h-stop"><span class="a-caret">›</span><span class="a-lbl">Stop</span><span class="a-desc">Cancel and remove this heartbeat</span></button>
        `;
        acts.querySelector("#h-tog").onclick = () => { hb.status = hb.status === "active" ? "paused" : "active"; hb.nextRun = hb.status === "active" ? "5m" : "paused"; render(); };
        acts.querySelector("#h-ed").onclick = () => { state.hbEditing = !state.hbEditing; render(); };
        acts.querySelector("#h-stop").onclick = () => { s.heartbeats = s.heartbeats.filter(z => z.id !== hb.id); state.drillId = null; render(); };
        scroll.appendChild(acts);
        if (state.hbEditing) scroll.appendChild(buildHbForm(s));
      }
    } else if (state.dockTab === "shells") {
      const sh = s.shells.find(x => x.id === state.drillId);
      if (sh) {
        const meta = document.createElement("div");
        meta.className = "tui-meta-line";
        meta.innerHTML = `<span class="lbl">pid</span> ${sh.pid} <span class="lbl">· started</span> ${sh.started} <span class="lbl">· duration</span> ${sh.duration} <span class="lbl">·</span> ${statusDotHtml(sh.status, sh.exit)}`;
        scroll.appendChild(meta);

        const tail = document.createElement("div");
        tail.className = "tui-tail";
        tail.textContent = sh.tail;
        scroll.appendChild(tail);

        const acts = document.createElement("div");
        acts.className = "tui-actions";
        acts.innerHTML = `
          <button class="tui-action" id="s-open"><span class="a-caret">›</span><span class="a-lbl">Open in Right sidebar</span><span class="a-desc">Keep full live tail open side by side</span></button>
          <button class="tui-action" id="s-ref"><span class="a-caret">›</span><span class="a-lbl">Refresh tail</span><span class="a-desc">Fetch latest output lines</span></button>
          ${sh.status === "running" ? `<button class="tui-action danger" id="s-kill"><span class="a-caret">›</span><span class="a-lbl">Kill</span><span class="a-desc">Terminate running shell (SIGTERM → SIGKILL)</span></button>` : ""}
        `;
        acts.querySelector("#s-open").onclick = () => openRightTab({ id: "sh:" + sh.id, kind: "shell", refId: sh.id, title: sh.cmd.slice(0, 22) });
        acts.querySelector("#s-ref").onclick = () => { if (sh.status === "running") sh.tail += "\ntest live_tail_ok ... ok"; render(); };
        const kb = acts.querySelector("#s-kill"); if (kb) kb.onclick = () => killSh(s, sh);
        scroll.appendChild(acts);
      }
    }
    frag.appendChild(scroll);
    const hint = document.createElement("div");
    hint.className = "tui-hint";
    hint.textContent = "Esc back · click an action to run";
    frag.appendChild(hint);
    return frag;
  }

  /* ---------- COLUMNED TABLE LIST ---------- */
  if (state.dockTab === "subagents") {
    if (!s.subagents.length) {
      scroll.innerHTML = `<div class="empty-line">No subagents in this session.</div>`;
    } else {
      const th = document.createElement("div");
      th.className = "tui-thead tui-cols-sub";
      th.innerHTML = `<div>&nbsp;&nbsp;Subagent</div><div>Activity</div><div>Duration</div><div>Status</div>`;
      scroll.appendChild(th);
      s.subagents.forEach((sub, idx) => {
        const r = document.createElement("div");
        r.className = "tui-trow tui-cols-sub" + (state.selectedIndex === idx ? " selected" : "");
        const prefix = sub.parentId ? `<span class="c-dim">↳ </span>` : "";
        r.innerHTML = `
          <div class="trunc"><span class="caret">›</span>${prefix}${sub.name}</div>
          <div class="trunc c-muted">${sub.activity}</div>
          <div class="c-muted">${sub.duration}</div>
          <div>${statusDotHtml(sub.status)}</div>
        `;
        r.onclick = () => { state.selectedIndex = idx; state.drillId = sub.id; render(); };
        scroll.appendChild(r);
      });
    }
  } else if (state.dockTab === "heartbeats") {
    if (!s.heartbeats.length) {
      scroll.innerHTML = `<div class="empty-line">No heartbeats for this session.</div>`;
    } else {
      const th = document.createElement("div");
      th.className = "tui-thead tui-cols-hb";
      th.innerHTML = `<div>&nbsp;&nbsp;Interval</div><div>Instruction</div><div>Next run</div><div>Status</div>`;
      scroll.appendChild(th);
      s.heartbeats.forEach((hb, idx) => {
        const r = document.createElement("div");
        r.className = "tui-trow tui-cols-hb" + (state.selectedIndex === idx ? " selected" : "");
        r.innerHTML = `
          <div class="trunc"><span class="caret">›</span>${hb.schedule}</div>
          <div class="trunc c-muted">${hb.prompt}</div>
          <div class="c-muted">${hb.nextRun}</div>
          <div>${statusDotHtml(hb.status)}</div>
        `;
        r.onclick = () => { state.selectedIndex = idx; state.drillId = hb.id; render(); };
        scroll.appendChild(r);
      });
    }
    if (state.hbEditing) scroll.appendChild(buildHbForm(s));
  } else if (state.dockTab === "shells") {
    if (!s.shells.length) {
      scroll.innerHTML = `<div class="empty-line">No shells in this session.</div>`;
    } else {
      const th = document.createElement("div");
      th.className = "tui-thead tui-cols-sh";
      th.innerHTML = `<div>&nbsp;&nbsp;Command</div><div>Duration</div><div>PID</div><div>Status</div>`;
      scroll.appendChild(th);
      s.shells.forEach((sh, idx) => {
        const r = document.createElement("div");
        r.className = "tui-trow tui-cols-sh" + (state.selectedIndex === idx ? " selected" : "");
        r.innerHTML = `
          <div class="trunc mono"><span class="caret">›</span>${sh.cmd}</div>
          <div class="c-muted">${sh.duration}</div>
          <div class="c-muted mono">${sh.pid}</div>
          <div>${statusDotHtml(sh.status, sh.exit)}</div>
        `;
        r.onclick = () => { state.selectedIndex = idx; state.drillId = sh.id; render(); };
        scroll.appendChild(r);
      });
    }
  }

  frag.appendChild(scroll);

  // TUI footer hint bar
  const hint = document.createElement("div");
  hint.className = "tui-hint";
  hint.innerHTML = `<span>↑↓ select · ↵ inspect · Esc close</span>`;
  if (state.dockTab === "heartbeats" && !state.hbEditing) {
    const userHb = s.heartbeats.find(h => h.owner === "user");
    const add = document.createElement("button");
    add.className = "tui-hint-btn";
    add.style.marginLeft = "auto";
    add.textContent = userHb ? "edit heartbeat" : "+ set heartbeat";
    add.onclick = () => { state.hbEditing = true; render(); };
    hint.appendChild(add);
  }
  frag.appendChild(hint);
  return frag;
}

/* Style C: TUI Expanded Ledger (pa-tui chrome::ActivityDock) */
function buildStyleCLedger(s, st) {
  const box = document.createElement("div");
  box.className = "tui-pane-ledger";

  const scroll = document.createElement("div");
  scroll.className = "tui-scroll";

  // 1. Subagents group
  const subHdr = document.createElement("div");
  subHdr.className = "tui-sec-row" + (state.dockTab === "subagents" ? " active" : "");
  subHdr.innerHTML = `
    <span class="tui-sec-k ${st.sub.live ? "live" : ""}">◆ ${st.sub.num} subagent${st.sub.num === 1 ? "" : "s"}</span>
    <span class="c-dim trunc" style="flex:1">${s.subagents.map(x => x.name).join(" · ") || "none"}</span>
    <span class="c-dim mono">${state.dockTab === "subagents" ? "▾" : "▸"}</span>
  `;
  subHdr.onclick = () => { state.dockTab = state.dockTab === "subagents" ? null : "subagents"; render(); };
  scroll.appendChild(subHdr);
  if (state.dockTab === "subagents") {
    const items = document.createElement("div");
    items.className = "tui-sec-items";
    if (!s.subagents.length) items.innerHTML = `<div class="c-dim" style="padding:3px 6px;font-size:12px;">No subagents in this session.</div>`;
    s.subagents.forEach(sub => {
      const r = document.createElement("div");
      r.className = "tui-sec-row";
      r.innerHTML = `
        <span class="trunc" style="width:150px;font-weight:500;">${sub.parentId ? "↳ " : ""}${sub.name}</span>
        <span class="c-muted trunc" style="flex:1">${sub.activity}</span>
        <span class="c-dim mono">${sub.duration}</span>
        <span>${statusDotHtml(sub.status)}</span>
        ${sub.status === "running"
          ? `<button class="tui-inline-act danger" data-a="stop">stop</button>`
          : `<button class="tui-inline-act danger" data-a="del">del</button>`}
      `;
      r.onclick = (e) => {
        if (e.target?.dataset?.a === "stop") { e.stopPropagation(); stopSub(s, sub); return; }
        if (e.target?.dataset?.a === "del") { e.stopPropagation(); delSub(s, sub); return; }
        openRightTab({ id: "sub:" + sub.id, kind: "subagent", refId: sub.id, title: sub.name });
      };
      items.appendChild(r);
    });
    scroll.appendChild(items);
  }

  // 2. Heartbeats group
  const hbHdr = document.createElement("div");
  hbHdr.className = "tui-sec-row" + (state.dockTab === "heartbeats" ? " active" : "");
  hbHdr.innerHTML = `
    <span class="tui-sec-k ${st.hb.live ? "live" : ""}">◷ ${st.hb.num} heartbeat${st.hb.num === 1 ? "" : "s"}</span>
    <span class="c-dim trunc" style="flex:1">${s.heartbeats.map(x => `${x.schedule} (${x.status})`).join(" · ") || "none"}</span>
    <span class="c-dim mono">${state.dockTab === "heartbeats" ? "▾" : "▸"}</span>
  `;
  hbHdr.onclick = () => { state.dockTab = state.dockTab === "heartbeats" ? null : "heartbeats"; state.hbEditing = false; render(); };
  scroll.appendChild(hbHdr);
  if (state.dockTab === "heartbeats") {
    const items = document.createElement("div");
    items.className = "tui-sec-items";
    s.heartbeats.forEach(hb => {
      const r = document.createElement("div");
      r.className = "tui-sec-row";
      r.style.cursor = "default";
      r.innerHTML = `
        <span class="mono" style="width:80px">${hb.schedule}</span>
        <span class="c-muted trunc" style="flex:1">${hb.prompt}</span>
        <span>${statusDotHtml(hb.status)}</span>
        <button class="tui-inline-act" data-a="tog">${hb.status === "active" ? "pause" : "resume"}</button>
        <button class="tui-inline-act danger" data-a="stop">stop</button>
      `;
      r.onclick = (e) => {
        if (e.target?.dataset?.a === "tog") { hb.status = hb.status === "active" ? "paused" : "active"; hb.nextRun = hb.status === "active" ? "5m" : "paused"; render(); }
        if (e.target?.dataset?.a === "stop") { s.heartbeats = s.heartbeats.filter(z => z.id !== hb.id); render(); }
      };
      items.appendChild(r);
    });
    if (state.hbEditing) items.appendChild(buildHbForm(s));
    else {
      const add = document.createElement("button");
      add.className = "tui-hint-btn";
      add.style.cssText = "align-self:flex-start;padding:3px 8px;";
      add.textContent = s.heartbeats.some(h => h.owner === "user") ? "› edit heartbeat" : "› + set heartbeat";
      add.onclick = () => { state.hbEditing = true; render(); };
      items.appendChild(add);
    }
    scroll.appendChild(items);
  }

  // 3. Shells group
  const shHdr = document.createElement("div");
  shHdr.className = "tui-sec-row" + (state.dockTab === "shells" ? " active" : "");
  shHdr.innerHTML = `
    <span class="tui-sec-k ${st.sh.live ? "live" : ""}">›_ ${st.sh.num} shell${st.sh.num === 1 ? "" : "s"}</span>
    <span class="c-dim trunc mono" style="flex:1">${s.shells[0]?.cmd || "none"}</span>
    <span class="c-dim mono">${state.dockTab === "shells" ? "▾" : "▸"}</span>
  `;
  shHdr.onclick = () => { state.dockTab = state.dockTab === "shells" ? null : "shells"; render(); };
  scroll.appendChild(shHdr);
  if (state.dockTab === "shells") {
    const items = document.createElement("div");
    items.className = "tui-sec-items";
    if (!s.shells.length) items.innerHTML = `<div class="c-dim" style="padding:3px 6px;font-size:12px;">No shells in this session.</div>`;
    s.shells.forEach(sh => {
      const r = document.createElement("div");
      r.className = "tui-sec-row";
      r.innerHTML = `
        <span class="mono trunc" style="flex:1">${sh.cmd}</span>
        <span class="c-dim mono">${sh.duration}</span>
        <span>${statusDotHtml(sh.status, sh.exit)}</span>
        ${sh.status === "running" ? `<button class="tui-inline-act danger" data-a="kill">kill</button>` : ""}
      `;
      r.onclick = (e) => {
        if (e.target?.dataset?.a === "kill") { e.stopPropagation(); killSh(s, sh); return; }
        openRightTab({ id: "sh:" + sh.id, kind: "shell", refId: sh.id, title: sh.cmd.slice(0, 22) });
      };
      items.appendChild(r);
    });
    scroll.appendChild(items);
  }

  box.appendChild(scroll);
  const hint = document.createElement("div");
  hint.className = "tui-hint";
  hint.innerHTML = `<span>click a row to open in Right sidebar · Esc collapse</span>`;
  box.appendChild(hint);
  return box;
}

function renderRightSidebar(s) {
  const rs = document.getElementById("right-sidebar");
  rs.classList.toggle("collapsed", !state.rightSidebarOpen);
  if (!state.rightSidebarOpen) return;

  const bar = document.getElementById("rs-tabbar");
  const body = document.getElementById("rs-body");
  bar.innerHTML = ""; body.innerHTML = "";

  const activeId = s.activeTab ?? s.tabs[0]?.id ?? null;
  s.tabs.forEach(t => {
    const el = document.createElement("div");
    el.className = "rs-tab" + (t.id === activeId ? " active" : "");
    const ic = t.kind === "diff" ? "±" : (t.kind === "subagent" ? "◆" : "›_");
    el.innerHTML = `<span class="mono" style="opacity:.7;font-size:11px;">${ic}</span><span>${t.title}</span><button class="rs-x">✕</button>`;
    el.onclick = () => { s.activeTab = t.id; render(); };
    el.querySelector(".rs-x").onclick = (e) => { e.stopPropagation(); closeRightTab(t.id); };
    bar.appendChild(el);
  });
  if (!s.tabs.some(t => t.id === "diff")) {
    const add = document.createElement("button");
    add.className = "rs-add-diff"; add.textContent = "+ Diff";
    add.onclick = () => openRightTab({ id: "diff", kind: "diff", title: "Diff" });
    bar.appendChild(add);
  }

  const active = s.tabs.find(t => t.id === activeId);
  if (!active) { body.innerHTML = `<div class="empty-line">No open tabs.</div>`; return; }

  if (active.kind === "diff") {
    body.innerHTML = `<div class="rs-hdr"><span style="font-weight:600;flex:1">Diff · ${s.name}</span><span class="c-dim mono">${s.branch}</span></div>`;
    s.diffFiles.forEach(df => {
      const c = document.createElement("div");
      c.className = "diff-card";
      c.innerHTML = `<div class="diff-hdr"><span>${df.file}</span><span class="st-run">${df.stats}</span></div><div class="diff-code">${df.lines.map(l => `<div class="dl ${l.t}">${l.s}</div>`).join("")}</div>`;
      body.appendChild(c);
    });
  } else if (active.kind === "subagent") {
    const sub = s.subagents.find(x => x.id === active.refId);
    if (!sub) { body.innerHTML = `<div class="empty-line">Subagent deleted.</div>`; return; }
    body.innerHTML = `
      <div class="rs-hdr">
        <span style="font-weight:600;flex:1" class="trunc">${sub.name}</span>
        <span>${statusDotHtml(sub.status)}</span>
        ${sub.status === "running"
          ? `<button class="tui-inline-act danger" id="rs-stop">stop</button>`
          : `<button class="tui-inline-act danger" id="rs-del">delete</button>`}
      </div>
      ${sub.transcript.map(m => `<div class="sub-msg"><div class="role">${m.role}</div><div>${m.text}</div></div>`).join("")}
      <div class="readonly-note">read-only · stop records "Cancelled by user"</div>
    `;
    const sb = body.querySelector("#rs-stop"); if (sb) sb.onclick = () => stopSub(s, sub);
    const db = body.querySelector("#rs-del"); if (db) db.onclick = () => delSub(s, sub);
  } else if (active.kind === "shell") {
    const sh = s.shells.find(x => x.id === active.refId);
    if (!sh) { body.innerHTML = `<div class="empty-line">Shell not found.</div>`; return; }
    body.innerHTML = `
      <div class="rs-hdr">
        <span class="mono trunc" style="flex:1">${sh.cmd}</span>
        <span>${statusDotHtml(sh.status, sh.exit)}</span>
        <button class="tui-inline-act" id="rs-ref">refresh</button>
        ${sh.status === "running" ? `<button class="tui-inline-act danger" id="rs-kill">kill</button>` : ""}
      </div>
      <div class="term-full">${sh.tail}</div>
    `;
    body.querySelector("#rs-ref").onclick = () => { if (sh.status === "running") sh.tail += "\ntest live_tail_refresh ... ok"; render(); };
    const kb = body.querySelector("#rs-kill"); if (kb) kb.onclick = () => killSh(s, sh);
  }
}

function render() {
  const s = cur();
  const st = stats(s);
  const vm = VARIANTS.find(v => v.key === state.variant);

  document.getElementById("sw-label").textContent = `Style ${vm.key} (${vm.name})`;
  document.getElementById("sw-hint").textContent = `· ${vm.hint}`;

  const rsBtn = document.getElementById("rs-toggle-btn");
  rsBtn.classList.toggle("active", state.rightSidebarOpen);
  document.getElementById("rs-tab-count").textContent = String(s.tabs.length);

  // Left sidebar
  const sl = document.getElementById("session-list");
  sl.innerHTML = "";
  Object.values(state.sessions).forEach(sess => {
    const sst = stats(sess);
    const el = document.createElement("div");
    el.className = "sess-row" + (sess.id === state.activeSessionId ? " active" : "");
    el.innerHTML = `
      <div class="sess-top"><span class="sdot ${sess.status}"></span><span class="sess-title">${sess.name}</span></div>
      <div class="sess-meta">${sst.sub.num} sub · ${sst.hb.num} hb · ${sst.sh.num} sh</div>
    `;
    el.onclick = () => {
      state.activeSessionId = sess.id;
      state.selectedIndex = 0;
      state.drillId = null;
      state.hbEditing = false;
      render();
    };
    sl.appendChild(el);
  });

  // Transcript
  const tr = document.getElementById("transcript");
  tr.innerHTML = "";
  s.messages.forEach(m => {
    const d = document.createElement("div");
    d.className = "msg " + m.role;
    d.innerHTML = `<div>${m.text}</div>` + (m.tools ? `<div class="tool-line">${m.tools.join("  ·  ")}</div>` : "");
    tr.appendChild(d);
  });

  // Activity chip
  const chip = document.getElementById("activity-chip");
  chip.innerHTML = "";
  [
    { id: "subagents", icon: "◆", label: "Subagents", m: st.sub },
    { id: "heartbeats", icon: "◷", label: "Heartbeats", m: st.hb },
    { id: "shells", icon: "›_", label: "Shells", m: st.sh }
  ].forEach(seg => {
    const isOpen = state.dockTab === seg.id;
    const b = document.createElement("button");
    b.className = "chip-seg" + (seg.m.live ? " running" : "") + (isOpen ? " open" : "");
    b.title = `${seg.label} (${seg.m.live ? "running" : "total"})`;
    b.innerHTML = `<span class="mono" style="font-size:11px;">${seg.icon}</span><span>${seg.m.num}</span>`;
    b.onclick = () => {
      if (state.dockTab === seg.id) { state.dockTab = null; state.drillId = null; }
      else { state.dockTab = seg.id; state.drillId = null; state.selectedIndex = 0; }
      state.hbEditing = false;
      render();
    };
    chip.appendChild(b);
  });

  // Mount chosen style
  const fullSlot = document.getElementById("full-dock-slot");
  const attSlot = document.getElementById("attached-dock-slot");
  fullSlot.innerHTML = "";
  attSlot.innerHTML = "";

  if (state.dockTab) {
    if (state.variant === "A") {
      const pane = document.createElement("div");
      pane.className = "tui-pane-full";
      pane.appendChild(buildTuiTableOrDetail(s, st, true));
      fullSlot.appendChild(pane);
    } else if (state.variant === "B") {
      const pane = document.createElement("div");
      pane.className = "tui-pane-attached";
      pane.appendChild(buildTuiTableOrDetail(s, st, false));
      attSlot.appendChild(pane);
    } else if (state.variant === "C") {
      fullSlot.appendChild(buildStyleCLedger(s, st));
    }
  }

  renderRightSidebar(s);
}

// Keyboard navigation (TUI feel: ↑/↓/Enter/Esc + ←/→ for variant switcher)
document.getElementById("rs-toggle-btn").onclick = () => {
  const s = cur();
  if (!state.rightSidebarOpen && !s.tabs.length) { s.tabs.push({ id: "diff", kind: "diff", title: "Diff" }); s.activeTab = "diff"; }
  state.rightSidebarOpen = !state.rightSidebarOpen;
  render();
};
document.getElementById("sw-prev").onclick = () => cycleVariant(-1);
document.getElementById("sw-next").onclick = () => cycleVariant(1);
document.addEventListener("keydown", (e) => {
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if (e.key === "ArrowLeft") { cycleVariant(-1); return; }
  if (e.key === "ArrowRight") { cycleVariant(1); return; }
  if (!state.dockTab) return;
  const s = cur();
  const list = state.dockTab === "subagents" ? s.subagents : (state.dockTab === "heartbeats" ? s.heartbeats : s.shells);
  if (e.key === "Escape") {
    if (state.hbEditing) state.hbEditing = false;
    else if (state.drillId) state.drillId = null;
    else state.dockTab = null;
    render();
  } else if (!state.drillId && list.length) {
    if (e.key === "ArrowDown") { e.preventDefault(); state.selectedIndex = (state.selectedIndex + 1) % list.length; render(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); state.selectedIndex = (state.selectedIndex - 1 + list.length) % list.length; render(); }
    else if (e.key === "Enter") {
      e.preventDefault();
      const item = list[state.selectedIndex];
      if (!item) return;
      if (state.variant === "C") {
        if (state.dockTab === "subagents") openRightTab({ id: "sub:" + item.id, kind: "subagent", refId: item.id, title: item.name });
        else if (state.dockTab === "shells") openRightTab({ id: "sh:" + item.id, kind: "shell", refId: item.id, title: item.cmd.slice(0, 22) });
      } else {
        state.drillId = item.id;
        render();
      }
    }
  }
});

render();
</script>
</body>
</html>
