[package]
name = "pa-client"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the daemon's own wire types: every command we emit is checked against the
# enum the supervisor deserializes, so protocol drift is a build error
pa-types = { path = "../../prime-agent/crates/pa-types" }
anyhow = "1"
# the vendored client in src/wire is the terminal UI's own transport
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }

[lib]
name = "pa_client"
path = "src/lib.rs"

[[bin]]
name = "pa-client"
path = "src/main.rs"

[[bin]]
name = "pipe-probe"
path = "src/pipe_probe.rs"
