[package]
name = "pa-ui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "prime-agent-app"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-channel = "2"
base64 = "0.22"
gpui-kit = { version = "0.10.0", features = ["syntect"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
pa-client = { path = "../pa-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
