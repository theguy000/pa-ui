[workspace]
resolver = "2"
members = ["pa-client", "pa-ui"]

# Iteration profile: release-quality codegen without LTO, so a rebuild stays
# in the seconds. `cargo build --profile fast -p pa-ui`
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = true

[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = true

# A `cargo run -p pa-ui` window should feel like the shipped one. Slint's layout
# and renderer live in dependencies, so optimize those; the workspace crates keep
# the dev profile's checks and backtraces.
[profile.dev.package."*"]
opt-level = 2
