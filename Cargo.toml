[workspace]
resolver = "2"
members = ["pa-client", "pa-ui"]

# Iteration profile: release-quality codegen without LTO, so a rebuild stays
# in the seconds. `cargo build --profile fast -p pa-ui`
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = true

[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = true
