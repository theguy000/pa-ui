[package]
name = "pa-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
pa-client = { path = "../pa-client" }
serde_json = "1"
crossbeam-channel = "0.5"
regex = "1"
fancy-regex = "0.14"
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "image-default-formats"] }
cosmic-text = "0.12"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# the system clipboard, for the sidebar's Copy id: the window's own backend keeps
# its clipboard private, so the one call that needs it goes to arboard directly
arboard = { version = "3", default-features = false }

[build-dependencies]
slint-build = "1.18"
